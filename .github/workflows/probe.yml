name: schedule-probe

# 临时探针：只为验证本仓库的 schedule 通道会不会自己触发。
# 验证完立即删除本文件。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "schedule probe fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
